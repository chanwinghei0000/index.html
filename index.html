<style>

</style>
</head>
<body>

function notice(){const b=$("nt");let seen="";try{seen=localStorage.getItem("ntseen")||""}catch(e){}
  b.hidden=!(cfg.notice&&cfg.noticeOn!==false&&!ntClosed);$("nts").textContent="📢 "+(cfg.notice||"")}
const OWNER="08ddf546f4806adf9162512fe51f2b3fb64587eebdc1aeef48b13fd8af57e0c2";
const H=async(u,p)=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(u+":"+p+":sws")))].map(b=>b.toString(16).padStart(2,"0")).join("");

function change(n,old,box){const a=el("input",{type:"password",placeholder:"新密碼（至少 8 個字元）",autocomplete:"new-password"}),b=el("input",{type:"password",placeholder:"再輸入新密碼",autocomplete:"new-password"}),er=el("small",{style:"color:#c0392b"});

function login(){const u=el("input",{type:"text",placeholder:"帳戶",autocomplete:"username"}),p=el("input",{type:"password",placeholder:"密碼",autocomplete:"current-password"}),er=el("small",{style:"color:#c0392b"});
  const box=el("div",{style:"position:fixed;inset:0;z-index:200;background:rgba(8,12,28,.6);display:grid;place-items:center;padding:20px"},el("div",{class:"box",style:"width:min(92vw,360px)"},el("h3",{style:"margin-top:0"},"管理員登入"),u,p,er,el("div",{class:"row"},el("button",{onclick:go},"登入"),el("button",{class:"g",onclick:()=>box.remove()},"取消"))));
  async function go(){const n=u.value.trim(),h=await H(n,p.value);let ok=false,exp=false;
    if(db){try{const d=await db.collection("accounts").doc(n).get();if(d.exists){ok=d.data().h===h;exp=ok&&Date.now()-(d.data().changed||0)>2592e6}else if(n==="swscwh"&&h===OWNER){ok=true;exp=true}}catch(e){}}
    if(!ok){er.textContent="帳戶或密碼錯誤";return}
    if(exp)return change(n,h,box);authOk(n,box)}
  p.onkeydown=e=>{if(e.key==="Enter")go()};document.body.append(box);u.focus()}
function accBox(){const u=el("input",{type:"text",placeholder:"新帳戶名稱"}),p=el("input",{type:"password",placeholder:"密碼"}),l=el("div");
  const ld=async()=>{try{const s=await db.collection("accounts").get();l.replaceChildren(...s.docs.map(d=>el("div",{class:"mi"},el("span",{style:"flex:1"},d.id),el("button",{class:"d",onclick:async()=>{await db.collection("accounts").doc(d.id).delete();ld()}},"刪除"))))}catch(e){l.textContent="暫時未能讀取帳戶列表"}};ld();
  return el("div",{class:"box"},el("h3",{style:"margin-top:0"},"其他管理員帳戶"),l,u,p,el("button",{onclick:async()=>{const n=u.value.trim();if(!n||!p.value)return;await db.collection("accounts").doc(n).set({h:await H(n,p.value),changed:0});u.value=p.value="";ld()}},"新增帳戶"))}
function settings(){

(async()=>{
